# ClipB config. Copy to ~/.config/clipb.toml (or symlink it from your dotfiles).
# Edits apply on the next clicked link; no restart.
#
# [router]: first matching rule wins, so keep specific rules above general ones.
#   "https://github.com/org/*"   contains ://  -> glob on the full URL
#   "*.example.com"              glob on the host (needs a subdomain)
#   "example.com"                that host and all its subdomains
#   "localhost:3000"             glob on host:port
# Target: "browser" or "browser:profile". Browsers: chrome, brave, edge, safari,
# firefox, or a bundle id. A Chromium profile is its signed-in email, display
# name or folder; emails stay valid across machines with different folders.
# "ask" shows a chooser instead of opening the link.
# Check a rule without opening anything:  clipb route https://github.com/my-org/x

[profiles]
work     = "chrome:you@work.example"
personal = "chrome:you@gmail.example"

[router]
# work
"https://github.com/my-org/*" = "work"
"*.corp.example"              = "work"
"jira.example.com"            = "work"
# personal
"youtube.com"                 = "personal"
# everything else
"*"                           = "personal"
# or ask each time: a chooser lists the Chrome profiles and Safari
# "*" = "ask"
# A chooser pick can also save a rule ("Remember for:"); the rule goes above "*".

# Pipes: Cmd+Shift+X cuts the selection and lists these (digits 1-9 pick one).
# The text goes to `run` on stdin, in a login shell. Its stdout replaces the
# cut text. No output: the text stays cut. Failure or Esc: the text comes back.
[pipe.en]
name = "Polish English"
run = 'pi -p --model openrouter/anthropic/claude-haiku-5.5 --system-prompt "$(tail -n +7 ~/.agents/skills/en/SKILL.md | sed "/^## How to respond/,/^## /{/^## Length/!d;}")" --append-system-prompt "Output the polished message only, as plain text. No > quote prefix, no notes about what changed." --no-tools --no-extensions --no-skills --no-prompt-templates --no-mcp --no-session --thinking off'

[pipe.todo]
name = "Add to to-do"
run = "cat >> ~/todo.md && echo >> ~/todo.md"

[pipe.upper]
name = "UPPERCASE"
run = "tr '[:lower:]' '[:upper:]'"
